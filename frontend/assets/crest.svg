<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E8C4" />
      <stop offset="45%" stop-color="#C59B3C" />
      <stop offset="100%" stop-color="#8C6620" />
    </linearGradient>
    <linearGradient id="crestDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1C18" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </linearGradient>
    <path id="textCircleTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
    <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="100" cy="100" r="96" fill="url(#crestDark)" stroke="url(#crestGold)" stroke-width="2" />
  <circle cx="100" cy="100" r="91" fill="none" stroke="url(#crestGold)" stroke-width="0.8" stroke-dasharray="3,3" />

  <!-- Inner Enclosure Ring -->
  <circle cx="100" cy="100" r="66" fill="#151311" stroke="url(#crestGold)" stroke-width="1.5" />

  <!-- Circular Stamp Typography -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="url(#crestGold)">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      BOOKHAVEN • CURATED EDITIONS
    </textPath>
  </text>
  <text font-family="'Inter', sans-serif" font-size="8" font-weight="600" letter-spacing="4.5" fill="url(#crestGold)">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      EST. 2026 • LITERARY HOUSE
    </textPath>
  </text>

  <!-- Center Decorative Emblems -->
  <g transform="translate(68, 68)">
    <!-- Star Points on Ring -->
    <polygon points="32,2 34,7 39,7 35,10 37,15 32,12 27,15 29,10 25,7 30,7" fill="url(#crestGold)" opacity="0.9" />

    <!-- Open Book in Center -->
    <path d="M32 24C23 19 12 21 6 24V50C12 47 23 45 32 49V24Z" 
          fill="#2C121A" 
          stroke="url(#crestGold)" 
          stroke-width="1.4" 
          stroke-linejoin="round" />
    <path d="M32 24C41 19 52 21 58 24V50C52 47 41 45 32 49V24Z" 
          fill="#2C121A" 
          stroke="url(#crestGold)" 
          stroke-width="1.4" 
          stroke-linejoin="round" />

    <!-- Center Spine & Flame -->
    <line x1="32" y1="22" x2="32" y2="50" stroke="url(#crestGold)" stroke-width="1.6" />

    <!-- Quill / Flame of Knowledge -->
    <path d="M32 12C34 16 35 18 32 21C29 18 30 16 32 12Z" fill="url(#crestGold)" />
    <circle cx="32" cy="10" r="1" fill="#FFFFFF" />

    <!-- Subtle Page Lines -->
    <line x1="12" y1="31" x2="26" y2="29" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />
    <line x1="12" y1="36" x2="26" y2="34" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />
    <line x1="12" y1="41" x2="24" y2="39.5" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />

    <line x1="38" y1="29" x2="52" y2="31" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />
    <line x1="38" y1="34" x2="52" y2="36" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />
    <line x1="40" y1="39.5" x2="52" y2="41" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Flourish Stars on Sides -->
  <circle cx="28" cy="100" r="2.5" fill="url(#crestGold)" />
  <circle cx="172" cy="100" r="2.5" fill="url(#crestGold)" />
</svg>
