<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" width="120" height="320">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84293D" />
      <stop offset="50%" stop-color="#67192A" />
      <stop offset="100%" stop-color="#46101C" />
    </linearGradient>
    <linearGradient id="foilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2DB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>
    <filter id="ribbonShadow" x="-15%" y="-5%" width="130%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#ribbonShadow)">
    <!-- Bookmark Leather Body with Chevron Tail -->
    <path d="M10 10 H110 V290 L60 260 L10 290 Z" fill="url(#leatherGrad)" stroke="url(#foilGold)" stroke-width="1.5" />
    <!-- Inner Stitching Line -->
    <path d="M16 16 H104 V278 L60 252 L16 278 Z" fill="none" stroke="url(#foilGold)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Top Hanging Hole & Brass Ring -->
    <circle cx="60" cy="36" r="6" fill="#1C1C1A" stroke="url(#foilGold)" stroke-width="1.5" />

    <!-- Brand Monogram Crest -->
    <g transform="translate(42, 60)">
      <path d="M18 4 C13 1 5 3 1 5 V26 C5 24 13 22 18 25 V4 Z" fill="none" stroke="url(#foilGold)" stroke-width="1.2" />
      <path d="M18 4 C23 1 31 3 35 5 V26 C31 24 23 22 18 25 V4 Z" fill="none" stroke="url(#foilGold)" stroke-width="1.2" />
      <line x1="18" y1="3" x2="18" y2="26" stroke="url(#foilGold)" stroke-width="1.4" />
    </g>

    <!-- Hot-Stamped Gold Lettering -->
    <text x="60" y="115" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" letter-spacing="3" fill="url(#foilGold)" text-anchor="middle">
      BOOKHAVEN
    </text>
    <line x1="35" y1="125" x2="85" y2="125" stroke="url(#foilGold)" stroke-width="0.5" opacity="0.6" />
    <text x="60" y="140" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" letter-spacing="2.5" fill="url(#foilGold)" text-anchor="middle" opacity="0.85">
      CURATED EDITIONS
    </text>

    <!-- Literary Quote -->
    <text x="60" y="180" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-style="italic" fill="#F8F5EF" text-anchor="middle" opacity="0.8">
      "Open your next
    </text>
    <text x="60" y="195" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-style="italic" fill="#F8F5EF" text-anchor="middle" opacity="0.8">
      story in the quiet
    </text>
    <text x="60" y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-style="italic" fill="#F8F5EF" text-anchor="middle" opacity="0.8">
      hours of the mind."
    </text>

    <!-- Ornamental Star Bottom -->
    <polygon points="60,230 62,235 67,235 63,238 65,243 60,240 55,243 57,238 53,235 58,235" fill="url(#foilGold)" opacity="0.75" />
  </g>
</svg>
